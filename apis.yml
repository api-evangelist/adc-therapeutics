aid: adc-therapeutics
name: ADC Therapeutics
description: 'ADC Therapeutics SA (NYSE: ADCT) is a commercial-stage biotechnology
  company headquartered at the Biopôle in Lausanne, Switzerland, with US operations
  in New Jersey, that discovers and develops antibody drug conjugates (ADCs) for
  hematologic malignancies and solid tumors. Its approved product ZYNLONTA
  (loncastuximab tesirine-lpyl) is a CD19-directed ADC for relapsed or refractory
  diffuse large B-cell lymphoma, and the company is expanding it into earlier lines
  through the LOTIS-5 Phase 3 and LOTIS-7 Phase 1b trials alongside a preclinical
  and clinical ADC pipeline. It is a therapeutics developer, not a software vendor:
  a 2026-09-07 probe of every host it operates found no developer portal, no public
  API, no SDK and no machine-readable contract.'
